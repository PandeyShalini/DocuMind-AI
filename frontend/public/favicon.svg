<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Rounded container -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />
  
  <!-- Glowing Abstract Document Contour -->
  <path d="M20 14h18l12 12v24a4 4 0 0 1-4 4H20a4 4 0 0 1-4-4V18a4 4 0 0 1 4-4z" 
        stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Document Folded Page -->
  <path d="M38 14v12h12" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- AI Sparkle / Magic Star (✨ Icon) -->
  <path d="M32 28c0 3 2 5 5 5-3 0-5 2-5 5 0-3-2-5-5-5 3 0 5-2 5-5z" 
        fill="url(#sparkleGrad)" filter="url(#neonGlow)" />
        
  <!-- Glowing Data Nodes / Tech Lines inside -->
  <line x1="22" y1="24" x2="32" y2="24" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="32" x2="28" y2="32" stroke="#64748B" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="40" x2="42" y2="40" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" />
  <line x1="22" y1="46" x2="36" y2="46" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" />
</svg>
